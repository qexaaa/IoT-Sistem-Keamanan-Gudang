<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login - Sistem Keamanan Gudang</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Firebase -->

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

</head>

<body class="login-page">

    <div class="login-container">

        <div class="login-card">

            <div class="login-logo">
                <i class="bi bi-hdd-network-fill"></i>
            </div>

            <h1>
                Sistem Keamanan Gudang
            </h1>

            <p>
                Monitoring ESP32 Realtime
            </p>

            <form onsubmit="login(event)">

                <div class="form-group">

                    <label>Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Masukkan Email"
                        required>

                </div>

                <div class="form-group">

                    <label>Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Masukkan Password"
                        required>

                </div>

                <button
                    type="submit"
                    class="login-btn">

                    Login

                </button>

            </form>

            <div
                id="errorMessage"
                class="error-message">

            </div>

        </div>

    </div>

    <script>

        const firebaseConfig = {

            apiKey: "AIzaSyAdzHc72EV0bU7z_Oa1lMYaSZeRaE-A9yg",
            authDomain: "sistem-keamanan-gudang.firebaseapp.com",
            databaseURL: "https://sistem-keamanan-gudang-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "sistem-keamanan-gudang",
            storageBucket: "sistem-keamanan-gudang.firebasestorage.app",
            messagingSenderId: "801935787739",
            appId: "1:801935787739:web:928b00d5197dc51e73eefe",
            measurementId: "G-H6GLRL4J3M"

        };

        firebase.initializeApp(firebaseConfig);

        const auth = firebase.auth();

        auth.onAuthStateChanged(user => {

            if (user) {

                window.location.href =
                    "dashboard.html";

            }

        });

    </script>

    <script src="login.js"></script>

</body>

</html>
